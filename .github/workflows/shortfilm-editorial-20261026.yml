name: Apply short-film report revision 2026-10-26
on:
  push:
    branches: [gh-pages]
    paths:
      - .github/scripts/shortfilm-finalize-20261026.py
      - .github/workflows/shortfilm-editorial-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shortfilm-editorial-20261026
  cancel-in-progress: false
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Apply scoped text changes and validate
        run: python3 .github/scripts/shortfilm-finalize-20261026.py .
      - name: Save report on the existing branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- shortfilm/index.html; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shortfilm/index.html
          git commit -m 'Update company payouts, ten-account plan and authorized-production target [skip ci]'
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        with:
          name: shortfilm-payment-scale-report-20261026
          path: shortfilm/index.html
          retention-days: 7
